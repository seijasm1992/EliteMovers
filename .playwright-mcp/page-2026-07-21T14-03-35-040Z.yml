        - generic [ref=e159]: How It Works
        - heading "Your Move in Three Simple Steps" [level=2] [ref=e160]
        - paragraph [ref=e161]: From quote to completion, we handle every detail so you never have to wonder what comes next. No surprises, no hidden fees — just a seamless experience backed by a flat-rate guarantee.
      - list [ref=e162]:
        - listitem [ref=e163]:
          - generic [ref=e165]: "1"
          - heading "Get Your Quote" [level=3] [ref=e167]
          - paragraph [ref=e168]: Request a quote online and we'll send you a quick virtual walkthrough link — just scan your space with your phone so we can see exactly what's moving. Prefer an in-person estimate? We'll send a team to your home. Either way, you'll get a guaranteed flat-rate price with no hidden fees.
        - listitem [ref=e169]:
          - generic [ref=e171]: "2"
          - heading "We Plan Everything" [level=3] [ref=e173]
          - paragraph [ref=e174]: Your dedicated move coordinator takes it from here — building approvals, certificates of insurance, elevator reservations, parking permits, and scheduling. Every detail is handled before moving day so there are zero surprises.
        - listitem [ref=e175]:
          - generic [ref=e176]: "3"
          - heading "Sit Back, We Handle the Rest" [level=3] [ref=e178]
          - paragraph [ref=e179]: Our uniformed, background-checked crew arrives on time with all the right equipment. Track your truck in real time and receive live updates throughout the move — we don't leave until every piece is placed exactly where you want it.
