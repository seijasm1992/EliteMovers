          - paragraph [ref=e141]: Your price is locked before move day. No hourly billing, no fuel surcharges, no hidden fees — just one transparent rate that covers everything.
        - generic [ref=e142]:
          - heading "Full Protection Coverage" [level=3] [ref=e147]
          - paragraph [ref=e148]: Every item is custom-wrapped and covered from door to door. Furniture, artwork, antiques — protected beyond the standard blanket wrap.
