          - heading "Get Your Quote" [level=3] [ref=e171]
          - paragraph [ref=e172]: Request a quote online and we'll send you a quick virtual walkthrough link — just scan your space with your phone so we can see exactly what's moving. Prefer an in-person estimate? We'll send a team to your home. Either way, you'll get a guaranteed flat-rate price with no hidden fees.
        - listitem [ref=e173]:
          - generic [ref=e175]: "2"
          - heading "We Plan Everything" [level=3] [ref=e177]
          - paragraph [ref=e178]: Your dedicated move coordinator takes it from here — building approvals, certificates of insurance, elevator reservations, parking permits, and scheduling. Every detail is handled before moving day so there are zero surprises.
        - listitem [ref=e179]:
          - generic [ref=e180]: "3"
          - heading "Sit Back, We Handle the Rest" [level=3] [ref=e182]
          - paragraph [ref=e183]: Our uniformed, background-checked crew arrives on time with all the right equipment. Track your truck in real time and receive live updates throughout the move — we don't leave until every piece is placed exactly where you want it.
