        - heading "Your Move in Three Simple Steps" [level=2] [ref=e138]
        - paragraph [ref=e139]: From quote to completion, we handle every detail so you never have to wonder what comes next. No surprises, no hidden fees — just a seamless experience backed by a flat-rate guarantee.
      - list [ref=e140]:
        - listitem [ref=e141]:
          - generic [ref=e143]: "1"
          - heading "Get Your Quote" [level=3] [ref=e145]
          - paragraph [ref=e146]: Request a quote online and we'll send you a quick virtual walkthrough link — just scan your space with your phone so we can see exactly what's moving. Prefer an in-person estimate? We'll send a team to your home. Either way, you'll get a guaranteed flat-rate price with no hidden fees.
        - listitem [ref=e147]:
          - generic [ref=e149]: "2"
          - heading "We Plan Everything" [level=3] [ref=e151]
          - paragraph [ref=e152]: Your dedicated move coordinator takes it from here — building approvals, certificates of insurance, elevator reservations, parking permits, and scheduling. Every detail is handled before moving day so there are zero surprises.
        - listitem [ref=e153]:
          - generic [ref=e154]: "3"
          - heading "Sit Back, We Handle the Rest" [level=3] [ref=e156]
          - paragraph [ref=e157]: Our uniformed, background-checked crew arrives on time with all the right equipment. Track your truck in real time and receive live updates throughout the move — we don't leave until every piece is placed exactly where you want it.
